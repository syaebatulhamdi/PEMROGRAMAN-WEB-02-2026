<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Papan Tugas Tim Marsha</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-pink-100 via-pink-50 to-lime-50/40 text-pink-800 min-h-screen font-sans antialiased selection:bg-lime-500 selection:text-white">
  
  <div class="flex h-screen overflow-hidden p-4 md:p-6 gap-6">
    
    <!-- Sidebar Anggota (Immersive Glassmorphism Card) -->
    <aside class="w-80 bg-white/80 backdrop-blur-xl border border-white/80 rounded-3xl p-6 flex flex-col shadow-xl shadow-pink-200/50">
      <div class="mb-6 flex items-center justify-between">
        <div>
          <h1 class="text-xl font-bold text-pink-900 tracking-tight flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-lime-600 animate-pulse"></span>
            Tim Marsha
          </h1>
          <p class="text-xs font-semibold text-pink-400 uppercase tracking-wider mt-1">Daftar Anggota</p>
        </div>
      </div>
      
      <div id="status-user" class="text-xs font-medium text-pink-500 mb-2"></div>
      <div id="user-list" class="space-y-2 overflow-y-auto flex-1 pr-1 custom-scrollbar"></div>
    </aside>

    <!-- Main Workspace (Immersive Glassmorphism Card) -->
    <main class="flex-1 bg-white/80 backdrop-blur-xl border border-white/80 rounded-3xl p-8 flex flex-col shadow-xl shadow-pink-200/50 overflow-hidden">
      
      <!-- Top Header & Modern Progress Bar -->
      <header class="mb-8 pb-6 border-b border-pink-100 flex items-center justify-between gap-6">
        <div>
          <h2 id="todo-header" class="text-2xl font-extrabold text-pink-900 tracking-tight">Pilih Anggota Tim</h2>
          <p id="todo-summary" class="text-sm font-medium text-pink-500 mt-1">Pilih salah satu anggota untuk melihat daftar tugas.</p>
        </div>

        <!-- Progress Widget (Kanan Atas) -->
        <div class="flex items-center gap-4 bg-pink-50/80 p-3.5 rounded-2xl border border-pink-200/60 shadow-inner">
          <div class="flex flex-col items-end">
            <span class="text-[10px] font-bold text-pink-400 uppercase tracking-wider">Progres</span>
            <span id="progress-text" class="text-xs font-bold text-emerald-600">0%</span>
          </div>
          <div class="w-36 bg-pink-200 rounded-full h-3 overflow-hidden p-0.5">
            <div id="progress-bar" class="bg-gradient-to-r from-emerald-500 to-teal-400 h-2 rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
          </div>
        </div>
      </header>

      <!-- Action Area: Input Cari & Tambah Tugas -->
      <section class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
        <!-- Input Pencarian -->
        <div class="relative">
          <input type="text" id="search-input" placeholder="Cari judul tugas..." class="w-full bg-pink-100/70 focus:bg-white text-pink-800 text-sm px-4 py-3 rounded-2xl border border-transparent focus:border-lime-300 focus:ring-4 focus:ring-lime-500/10 transition-all outline-none font-medium placeholder-pink-400">
        </div>

        <!-- Form Tambah Tugas -->
        <form id="add-todo-form" class="flex flex-col gap-1">
          <div class="flex gap-2">
            <input type="text" id="todo-input" placeholder="Tambah tugas baru (min. 5 karakter)..." class="flex-1 bg-pink-100/70 focus:bg-white text-pink-800 text-sm px-4 py-3 rounded-2xl border border-transparent focus:border-lime-300 focus:ring-4 focus:ring-lime-500/10 transition-all outline-none font-medium placeholder-pink-400">
            <button type="submit" id="btn-save" class="bg-lime-600 hover:bg-lime-700 active:scale-95 text-white font-semibold px-6 py-3 rounded-2xl text-sm transition-all shadow-lg shadow-lime-600/20 flex items-center gap-1.5 flex-shrink-0 cursor-pointer">
              <span>Simpan</span>
            </button>
          </div>
          <span id="form-error" class="text-xs font-semibold text-rose-500 px-2 hidden"></span>
        </form>
      </section>

      <!-- Notification Toast & Status Indicator -->
      <div id="notification" class="hidden mb-4 p-3.5 bg-emerald-500/10 border border-emerald-500/20 text-emerald-700 rounded-2xl text-sm font-semibold flex items-center gap-2"></div>
      <div id="status-todo" class="text-sm font-semibold text-pink-400 mb-2"></div>

      <!-- Scrollable Task List -->
      <div class="flex-1 overflow-y-auto pr-2 custom-scrollbar">
        <ul id="todo-list" class="space-y-2"></ul>
        <div id="empty-search" class="hidden text-center py-16">
          <p class="text-pink-400 font-medium text-sm">Tidak ada tugas yang cocok.</p>
        </div>
      </div>

    </main>

  </div>
  <script src="script.js"></script>
</body>
</html>
