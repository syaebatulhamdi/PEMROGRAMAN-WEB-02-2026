<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papan Tugas Tim Marsha</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-slate-200 min-h-screen flex flex-col font-sans">

    <div class="flex flex-1">
        <aside class="w-80 bg-zinc-950 border-r border-zinc-800/80 p-6 flex flex-col">
            <h1 class="text-xl font-bold text-white mb-4">Tim Marsha and The BEAR</h1>
            <p class="text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-3">Anggota</p>
            
            <div id="container-anggota" class="space-y-2 overflow-y-auto flex-1">
                <p id="status-muat-anggota" class="text-sm text-zinc-500 italic">Memuat anggota...</p>
            </div>
        </aside>

        <main class="flex-1 p-8 bg-black">
            <div id="panel-tugas" class="max-w-4xl bg-zinc-950 border border-zinc-800/80 rounded-xl p-6">
                <div class="mb-6 border-b border-zinc-800/80 pb-4">
                    <h2 id="judul-panel-tugas" class="text-2xl font-bold text-white">Pilih Anggota</h2>
                    <div class="flex justify-between items-center mt-2">
                        <p id="ringkasan-progres" class="text-sm text-zinc-400">0 dari 0 tugas selesai</p>
                        <div class="w-48 bg-zinc-800 rounded-full h-2.5 overflow-hidden">
                            <div id="progress-bar" class="bg-cyan-500 h-2.5 transition-all duration-300" style="width: 0%"></div>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    <div>
                        <input type="text" id="input-pencarian" placeholder="Cari judul tugas" class="w-full px-4 py-2 bg-zinc-900 border border-zinc-800 rounded-lg text-zinc-200 placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-cyan-600 text-sm">
                    </div>

                    <form id="form-tambah-tugas" class="flex gap-2">
                        <div class="flex-1 relative">
                            <input type="text" id="input-judul-tugas" placeholder="Tambah tugas baru, minimal 5 karakter" class="w-full px-4 py-2 bg-zinc-900 border border-zinc-800 rounded-lg text-zinc-200 placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-cyan-600 text-sm">
                        </div>
                        <button type="submit" id="tombol-simpan" class="bg-cyan-700 hover:bg-cyan-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">Simpan</button>
                    </form>
                </div>

                <p id="pesan-error-form" class="text-xs text-rose-400 mb-4 hidden"></p>
                <p id="notif-sukses" class="text-xs text-cyan-400 font-medium mb-4 hidden"></p>

                <div id="container-tugas" class="space-y-3">
                    <p class="text-sm text-zinc-500 italic">Silakan pilih salah satu anggota dari menu di sebelah kiri untuk melihat daftar tugas.</p>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
