<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Tugas Tim - Marsha</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-6xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-gray-800">Manajemen Tugas Tim</h1>
            <p class="text-gray-600">Pantau dan kelola tugas harian anggota tim dengan mudah</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Daftar Anggota -->
            <div class="bg-white p-4 rounded-lg shadow">
                <h2 class="text-xl font-semibold mb-4 text-gray-700">Daftar Anggota</h2>
                <p id="statusAnggota" class="text-gray-500 italic">Memuat anggota...</p>
                <div id="listAnggota" class="flex flex-col space-y-2"></div>
            </div>

            <!-- Bagian Tugas & Kontrol -->
            <div class="bg-white p-4 rounded-lg shadow md:col-span-2">
                <h2 id="judulTugas" class="text-xl font-semibold mb-4 text-gray-700">Pilih Anggota Terlebih Dahulu</h2>
                <p id="statusTugas" class="text-gray-500 italic mb-4"></p>

                <!-- Ringkasan Progres -->
                <div id="progresTugas" class="mb-4 text-sm font-medium text-gray-600"></div>

                <!-- Kotak Pencarian -->
                <div class="mb-4">
                    <input type="text" id="cariTugas" placeholder="Cari tugas berdasarkan judul..." class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" />
                </div>

                <!-- Form Tambah Tugas -->
                <form id="formTambah" class="mb-4 flex flex-col space-y-2">
                    <div class="flex space-x-2">
                        <input type="text" id="inputJudul" placeholder="Masukkan judul tugas baru..." class="flex-1 px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" />
                        <button type="submit" id="btnSimpan" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition">Simpan</button>
                    </div>
                    <p id="errorForm" class="text-red-500 text-sm"></p>
                </form>

                <!-- Notifikasi -->
                <div id="notifikasi" class="mb-4 text-green-600 font-medium text-sm"></div>
                <p id="pesanPencarian" class="text-gray-500 italic mb-2"></p>

                <!-- Daftar Tugas -->
                <ul id="listTugas" class="space-y-2"></ul>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
